version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/dagu.lpk
  target_arch: amd64
update:
  strategy: publish
  sync_license: true
  allow_downgrade: false
  version_source:
    type: image
    image: dagu
build:
  run_buildscript: false
images:
- id: dagu
  target: service
  service: dagu
  source: ghcr.io/dagucloud/dagu
  channel: stable
  sort: semver
  tag_regex: ^v?\d+\.\d+\.\d+$
  delivery:
    mode: mirror
    require_digest_match: true
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Dagu
    summary: YAML 工作流编排与任务调度平台
