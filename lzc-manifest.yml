application:
  public_path:
    - /
  subdomain: dagu
  upstreams:
    - backend: http://dagu:8080/
      location: /
services:
  dagu:
    binds:
      - /lzcapp/var/data:/var/lib/dagu
    command: dagu start-all
    environment:
      - TZ=Asia/Shanghai
      - DAGU_HOST=0.0.0.0
      - DAGU_PORT=8080
      - DAGU_HOME=/var/lib/dagu
      - DAGU_AUTH_MODE=builtin
    # upstream: ghcr.io/dagucloud/dagu:2.20.1
    image: ghcr.1ms.run/dagucloud/dagu:2.20.1
usage: 首次打开请立即在 /setup 创建管理员。保留内置认证，工作流可执行命令，仅限可信用户。不挂载宿主 Docker socket。
