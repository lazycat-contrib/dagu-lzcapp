application:
  subdomain: dagu
  public_path:
  - /
  upstreams:
  - location: /
    backend: http://dagu:8080/
  injects:
  - id: open-save-chooser
    'on': browser
    when:
    - /*
    do:
    - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
services:
  dagu:
    image: ghcr.1ms.run/dagucloud/dagu:v2.20.1
    environment:
    - TZ=Asia/Shanghai
    - DAGU_HOST=0.0.0.0
    - DAGU_PORT=8080
    - DAGU_HOME=/var/lib/dagu
    - DAGU_AUTH_MODE=builtin
    binds:
    - /lzcapp/var/data:/var/lib/dagu
    command: dagu start-all
usage: 首次打开请立即在 /setup 创建管理员。保留内置认证，工作流可执行命令，仅限可信用户。不挂载宿主 Docker socket。
